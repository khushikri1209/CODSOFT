<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codsoft-Internship</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --radius: 16px;
            --transition: 160ms ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
            background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a 70%);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
        }

        .card {
            width: min(640px, 100%);
            display: grid;
            gap: 28px;
            background: linear-gradient(155deg, var(--panel), #24324b 70%);
            border: 1px solid #2c3c55;
            padding: 40px 44px 48px;
            border-radius: var(--radius);
            position: relative;
            box-shadow: 0 18px 48px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
              radial-gradient(circle at 85% 15%, rgba(99,102,241,.25), transparent 60%),
              radial-gradient(circle at 10% 90%, rgba(236,72,153,.20), transparent 65%);
            opacity: .9;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 2.8rem);
            font-weight: 650;
            letter-spacing: -1px;
            background: linear-gradient(90deg,#6366f1,#8b5cf6 55%,#ec4899);
            -webkit-background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: .95rem;
            line-height: 1.4;
            max-width: 52ch;
            color: var(--muted);
        }

        .links {
            display: grid;
            gap: 16px;
        }

        a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border: 1px solid var(--panel);
            background: linear-gradient(145deg, var(--panel), #24324b);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            border-radius: 12px;
            isolation: isolate;
            overflow: hidden;
            transition: var(--transition);
        }

        a::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, rgba(99,102,241,.35), transparent 70%);
            opacity: 0;
            transition: var(--transition);
        }

        a:hover::before { opacity: 1; }

        a:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px -6px rgba(0,0,0,.5), 0 0 0 1px rgba(99,102,241,.6);
        }

        a:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px -4px rgba(0,0,0,.6);
        }

        a span {
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .5px;
            color: var(--muted);
            text-transform: uppercase;
        }

        a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        .actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn {
            cursor: pointer;
            border: 0;
            font: inherit;
            padding: 14px 22px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            letter-spacing: .4px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 6px 18px -6px rgba(99,102,241,.55);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px -8px rgba(99,102,241,.6);
        }

        .btn:active { transform: translateY(0); }

        .btn.secondary {
            background: #334155;
            box-shadow: 0 4px 14px -6px rgba(0,0,0,.5);
        }

        .btn.secondary:hover {
            background: #475569;
        }

        @media (max-width: 640px) {
            .card { padding: 32px 28px 40px; gap: 24px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .card { animation: fadeSlide .6s ease both; }
            a { animation: fadeSlide .55s ease both; }
            a:nth-child(2) { animation-delay: .10s; }
            a:nth-child(3) { animation-delay: .20s; }
            .actions .btn { animation: fadeSlide .6s ease both .25s; }
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Codsoft Internship</h1>
        <p class="subtitle">Select a project below to open it. Explore, learn, iterate.</p>
        <div class="links">
            <a href="./Calculator/index.html"><span>Project</span>Calculator</a>
            <a href="./Khushi Portfolio/index.html"><span>Project</span>Portfolio</a>
            <a href="./Landing_Page/index.html"><span>Project</span>Landing Page</a>
        </div>
        
    </main>
</body>
</html>
